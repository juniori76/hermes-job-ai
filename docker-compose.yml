services:
  hermes:
    build: .
    container_name: hermes_job_ai
    restart: unless-stopped
    ports:
      - "8090:8088"
    env_file:
      - .env
    environment:
      - PORT=8088
      - HOST=0.0.0.0
    volumes:
      # Cookies de login, banco, currículo e chave salva pelo painel
      - ./data:/app/data
      - ./config:/app/config
    deploy:
      resources:
        limits:
          memory: 2048M
