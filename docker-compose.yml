services:
  hermes:
    build: .
    container_name: hermes_job_ai
    restart: unless-stopped
    ports:
      - "8090:8088" # Painel Web do Hermes
      - "6080:6080" # noVNC Interface Gráfica do Navegador
    env_file:
      - .env
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - DISPLAY=:99
    volumes:
      # Cookies de login, banco, currículo e prints
      - ./data:/app/data
      - ./config:/app/config
    deploy:
      resources:
        limits:
          memory: 2560M
