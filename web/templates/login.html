<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hermes Job AI - Acesso Seguro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #070a13; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: #0b0f19; border: 1px solid #1e293b; color: white; border-radius: 0.85rem; }
    .glass-input:focus { border-color: #6366f1; outline: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass-card max-w-md w-full p-8 rounded-3xl shadow-2xl space-y-6 relative overflow-hidden">
    <!-- Efeito de gradiente de fundo -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center space-y-2">
      <div class="inline-flex bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-3.5 rounded-2xl shadow-lg shadow-indigo-500/25 mb-1">
        <i class="fa-solid fa-robot text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Hermes Job AI</h1>
      <p class="text-xs text-slate-400">Entre com suas credenciais para acessar sua Central de Vagas</p>
    </div>

    {% if error %}
    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3.5 rounded-2xl text-xs flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-400 block mb-1.5">Usuário</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" name="username" required placeholder="eduardo" value="eduardo" class="w-full pl-10 pr-4 py-2.5 text-sm glass-input">
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-400 block mb-1.5">Senha</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 text-sm glass-input">
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm py-3 rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 mt-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Acessar Central
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i> Autenticação Criptografada • Servidor Pessoal
      </p>
    </div>
  </div>

</body>
</html>
